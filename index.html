<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enter IMC · 客戶報告總覽</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
:root {
  --eb:#1B3A8C;--eb2:#254BAD;--eb3:#0D2568;
  --ed:#0A1628;--el:#A8C8F8;--el2:#4A90D9;
  --em:#C5D5F0;--elt:#F0F5FF;--emut:#5C7AA8;
  --text:#1A2B3C;--mid:#C5D5F0;
  --org:#C75000;--grn:#1A7A44;--red:#C0392B;--teal:#0E6A7C;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:#D8E4F5;color:var(--text);min-height:100vh;}
.header{background:var(--eb);box-shadow:0 3px 16px rgba(0,0,0,.2);}
.header-inner{max-width:1100px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
.header img{height:36px;border-radius:4px;}
.header-title{color:rgba(255,255,255,.55);font-size:11px;letter-spacing:2px;text-transform:uppercase;}
.hero{background:linear-gradient(135deg,var(--eb3) 0%,var(--eb) 60%,var(--eb2) 100%);padding:52px 32px 44px;text-align:center;}
.hero h1{color:white;font-size:26px;font-weight:900;margin-bottom:8px;}
.hero h1 span{color:var(--el);}
.hero p{color:rgba(255,255,255,.6);font-size:12.5px;}
.stats{background:white;border-bottom:2px solid var(--mid);}
.stats-inner{max-width:1100px;margin:0 auto;padding:14px 32px;display:flex;gap:32px;align-items:center;flex-wrap:wrap;}
.stat{text-align:center;}
.stat-n{font-size:22px;font-weight:900;color:var(--eb);line-height:1;}
.stat-l{font-size:10px;color:var(--emut);margin-top:2px;}
.stats-div{width:1px;height:36px;background:var(--mid);}
.search-wrap{flex:1;display:flex;justify-content:flex-end;}
.search-wrap input{width:240px;padding:7px 14px;border:1.5px solid var(--mid);border-radius:20px;font-family:inherit;font-size:12px;color:var(--text);outline:none;transition:border .2s;}
.search-wrap input:focus{border-color:var(--el2);}
.main{max-width:1100px;margin:0 auto;padding:32px;}
.filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.ftab{padding:5px 16px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--mid);background:white;color:var(--emut);transition:all .15s;}
.ftab.active,.ftab:hover{background:var(--eb);color:white;border-color:var(--eb);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.card{background:white;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;transition:transform .15s,box-shadow .15s;text-decoration:none;display:block;color:inherit;}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,.13);}
.card-stripe{height:5px;}
.card-head{padding:18px 20px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.card-icon{width:44px;height:44px;border-radius:8px;background:var(--elt);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.card-meta{flex:1;min-width:0;}
.card-client{font-size:14px;font-weight:900;color:var(--eb3);line-height:1.2;margin-bottom:3px;}
.card-type{font-size:10px;color:var(--emut);font-weight:500;}
.card-score-wrap{text-align:right;flex-shrink:0;}
.card-score{font-size:22px;font-weight:900;line-height:1;}
.card-score-l{font-size:9px;color:var(--emut);}
.card-body{padding:0 20px 14px;}
.card-desc{font-size:11.5px;color:var(--emut);line-height:1.65;margin-bottom:10px;}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;background:var(--elt);color:var(--eb);border:1px solid var(--mid);}
.card-foot{padding:10px 20px;background:var(--elt);border-top:1px solid var(--mid);display:flex;justify-content:space-between;align-items:center;}
.card-date{font-size:10px;color:var(--emut);}
.card-cta{font-size:10.5px;font-weight:700;color:var(--el2);}
.score-r{color:var(--red);}.score-o{color:var(--org);}.score-a{color:#B8860B;}.score-g{color:var(--grn);}.score-b{color:var(--teal);}
.loading{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--emut);font-size:13px;}
.empty{text-align:center;padding:60px 20px;color:var(--emut);font-size:13px;display:none;}
.footer{background:var(--eb);margin-top:60px;padding:20px 32px;text-align:center;}
.footer p{font-size:10px;color:rgba(255,255,255,.4);}
@media(max-width:600px){
  .header-inner,.stats-inner,.main{padding-left:16px;padding-right:16px;}
  .hero{padding:36px 16px 30px;}
  .search-wrap{flex:0 0 100%;justify-content:stretch;}
  .search-wrap input{width:100%;}
}
</style>
</head>

<script>
const GITHUB_USER = 'june8525';
const GITHUB_REPO = 'enterimc-reports';

const TYPE_MAP = {
  audit: { label:'GEO 健檢報告',   icon:'📊', stripe:'#C75000' },
  plan:  { label:'AIO/AEO/GEO 策略計畫', icon:'📋', stripe:'#0E6A7C' },
  quote: { label:'服務報價單',      icon:'💰', stripe:'#1A7A44' },
  other: { label:'其他文件',        icon:'📄', stripe:'#1B3A8C' },
};

// 分數顏色
function scoreClass(s) {
  if (!s || s === '-') return 'score-b';
  const n = parseInt(s);
  if (n < 40) return 'score-r';
  if (n < 60) return 'score-o';
  if (n < 75) return 'score-a';
  return 'score-g';
}

// 日期格式化 2026-03-27 → 2026.03.27
function fmtDate(d) {
  return d ? d.replace(/-/g, '.') : '';
}

// 從檔名推斷 fallback 資訊（當 meta 不存在時）
function parseFilename(filename) {
  const name = filename.replace('.html','');
  const parts = name.split('_');
  const typeKeys = Object.keys(TYPE_MAP);
  let typeIndex = -1, typeKey = 'other';
  for (let i = 0; i < parts.length; i++) {
    if (typeKeys.includes(parts[i].toLowerCase())) {
      typeIndex = i; typeKey = parts[i].toLowerCase(); break;
    }
  }
  const lastPart = parts[parts.length-1];
  const isDate = /^\d{8}$/.test(lastPart);
  const dateStr = isDate ? lastPart : '';
  const dateFormatted = dateStr
    ? dateStr.slice(0,4)+'.'+dateStr.slice(4,6)+'.'+dateStr.slice(6,8) : '';
  const skipWords = ['GEO','AIO','AEO','SEO','DA','TW'];
  const clientParts = typeIndex > 0
    ? parts.slice(0,typeIndex).filter(p => !skipWords.includes(p.toUpperCase()))
    : parts.slice(0, Math.max(1, parts.length-(isDate?1:0)-1));
  return {
    client: clientParts.join(' ') || name,
    type: typeKey,
    date: dateFormatted,
    score: '',
    desc: '',
    tags: [],
  };
}

// 用 fetch 抓單一報告 HTML 的 meta 資訊
async function fetchMeta(rawUrl) {
  try {
    const res = await fetch(rawUrl);
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const g = name => doc.querySelector('meta[name="'+name+'"]')?.content || '';
    return {
      client: g('report-client'),
      score:  g('report-score'),
      desc:   g('report-desc'),
      tags:   g('report-tags') ? g('report-tags').split(',').map(t=>t.trim()) : [],
      type:   g('report-type') || 'other',
      date:   fmtDate(g('report-date')),
      hasMeta: !!g('report-client'),
    };
  } catch(e) { return { hasMeta: false }; }
}

function makeCard(info, filename) {
  const t = TYPE_MAP[info.type] || TYPE_MAP.other;
  const sc = info.score && info.score !== '-' ? info.score : '—';
  const scClass = scoreClass(info.score);
  const scLabel = sc !== '—' ? '/ 100 分' : '策略文件';
  const tagsHtml = info.tags.length
    ? info.tags.map(tg => '<span class="tag">'+tg+'</span>').join('')
    : '<span class="tag">'+info.client+'</span><span class="tag">'+(t.label)+'</span>';
  const descHtml = info.desc
    ? '<div class="card-desc">'+info.desc+'</div>' : '';
  return `
    <a class="card" href="reports/${filename}" target="_blank"
       data-type="${info.type}"
       data-keywords="${(info.client+' '+info.type+' '+(info.tags.join(' '))).toLowerCase()}">
      <div class="card-stripe" style="background:${t.stripe};"></div>
      <div class="card-head">
        <div class="card-icon">${t.icon}</div>
        <div class="card-meta">
          <div class="card-client">${info.client}</div>
          <div class="card-type">${t.label}</div>
        </div>
        <div class="card-score-wrap">
          <div class="card-score ${scClass}">${sc}</div>
          <div class="card-score-l">${scLabel}</div>
        </div>
      </div>
      <div class="card-body">
        ${descHtml}
        <div class="card-tags">${tagsHtml}</div>
      </div>
      <div class="card-foot">
        <div class="card-date">${info.date}</div>
        <div class="card-cta">開啟報告 →</div>
      </div>
    </a>`;
}

let allReports = [];
let currentFilter = 'all';

function setFilter(type, el) {
  currentFilter = type;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('cardGrid');
  const filtered = allReports.filter(r => {
    const matchType = currentFilter === 'all' || r.info.type === currentFilter;
    const matchSearch = !q || (r.info.client+' '+r.info.type+' '+r.info.tags.join(' ')+' '+r.info.desc).toLowerCase().includes(q);
    return matchType && matchSearch;
  });
  grid.innerHTML = filtered.length ? filtered.map(r => makeCard(r.info, r.filename)).join('') : '';
  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  const clients = new Set(allReports.map(r => r.info.client));
  document.getElementById('totalCount').textContent = allReports.length;
  document.getElementById('clientCount').textContent = clients.size;
}

async function loadReports() {
  const api = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/reports`;
  try {
    const res = await fetch(api);
    if (!res.ok) throw new Error('API '+res.status);
    const files = await res.json();
    const htmlFiles = files.filter(f => f.name.endsWith('.html'));

    // 並行抓所有報告的 meta
    const results = await Promise.all(htmlFiles.map(async f => {
      const fallback = parseFilename(f.name);
      const meta = await fetchMeta(f.download_url);
      const info = meta.hasMeta ? { ...meta, date: meta.date || fallback.date } : fallback;
      return { filename: f.name, info };
    }));

    // 新→舊排序
    allReports = results.sort((a,b) => b.info.date.localeCompare(a.info.date));
    document.getElementById('loadingMsg')?.remove();
    renderCards();
  } catch(e) {
    document.getElementById('loadingMsg').textContent = '⚠️ 無法載入報告清單，請確認 repo 設定是否正確。';
    console.error(e);
  }
}

loadReports();
</script>
